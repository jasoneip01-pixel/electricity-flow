<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5,viewport-fit=cover">
<title>2026暑假 · 5,600km 地貌之旅</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;--surface:#0f1420;--surface2:#161c2e;--border:rgba(148,200,255,.08);
  --text:#e2e8f0;--muted:#7888a8;--accent:#4dd0e1;--warm:#f0a050;
  --karst:#4a8c3f;--basin:#c47030;--shudao:#7a5c3a;--loess:#c4a060;
  --qilian:#5a8a5a;--forest:#2a5a2a;--flower:#d4a020;--snow:#c8d8e8;
  --desert:#d4a060;--plain:#7a9a4a;--hill:#6b8e4a;--delta:#3a6a5a
}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* Header */
header{padding:24px 20px 12px;text-align:center;border-bottom:1px solid var(--border)}
header h1{font-size:clamp(18px,4vw,28px);font-weight:800;letter-spacing:-.8px;margin-bottom:2px}
header .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 16px;text-align:center;min-width:70px}
.stat .big{font-size:clamp(14px,2.5vw,22px);font-weight:800;color:var(--accent);line-height:1.2}
.stat .big.warm{color:var(--warm)}
.stat .label{font-size:9px;color:var(--muted)}

/* Layout */
main{display:grid;grid-template-columns:1fr 360px;gap:0;min-height:420px;border-bottom:1px solid var(--border)}
@media(max-width:860px){main{grid-template-columns:1fr}}

/* Map area */
.map-area{position:relative;overflow:hidden;padding:16px 12px;display:flex;align-items:center;min-height:380px}
.map-area svg{width:100%;height:auto;display:block}
@media(max-width:860px){.map-area{min-height:300px;padding:10px 6px}}

/* Terrain legend within map */
.terrain-label{font-size:8px;fill:rgba(255,255,255,.5);text-anchor:middle;font-weight:500}

/* Waypoint dots */
.wp-dot{cursor:pointer;transition:all .2s}
.wp-dot:hover{filter:brightness(1.6)}
.wp-dot.active{filter:brightness(1.8) drop-shadow(0 0 6px rgba(77,208,225,.6))}

/* Info Panel */
.info-panel{padding:16px;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;max-height:420px;transition:all .3s}
@media(max-width:860px){
  .info-panel{position:fixed;bottom:0;left:0;right:0;z-index:50;max-height:50vh;border-left:none;border-top:1px solid var(--border);border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.4);transform:translateY(calc(100% - 44px))}
  .info-panel.open{transform:translateY(0)}
  .info-handle{display:flex;align-items:center;justify-content:center;padding:8px;cursor:pointer}
  .info-handle::before{content:'';width:32px;height:4px;background:var(--muted);border-radius:2px;opacity:.4}
}
@media(min-width:861px){.info-handle{display:none}}

.info-panel h3{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.info-panel .day{font-size:10px;color:var(--accent);font-weight:600;margin-bottom:6px}
.info-panel .elev{font-size:11px;color:var(--warm);margin-bottom:4px}
.info-panel .terrain{display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:12px;font-size:9px;font-weight:600;margin-bottom:8px}
.info-panel .desc{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:6px}
.info-panel .geo{font-size:10px;font-style:italic;color:rgba(255,255,255,.25);padding:6px 0;border-top:1px solid var(--border);margin-top:6px}
.info-hint{font-size:10px;color:var(--muted);text-align:center;padding:20px;opacity:.5}

/* Elevation section */
.elev-section{padding:16px 20px;border-bottom:1px solid var(--border)}
.elev-section h2{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--muted)}
.elev-section svg{width:100%;height:auto;display:block}

/* Terrain legend */
.legend{padding:16px 20px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.legend-item{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted);padding:3px 8px;background:var(--surface);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .15s;white-space:nowrap}
.legend-item:hover{border-color:rgba(255,255,255,.2);color:var(--text)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-count{font-size:8px;color:rgba(255,255,255,.15);margin-left:2px}

footer{padding:12px;text-align:center;font-size:9px;color:rgba(255,255,255,.08)}
footer a{color:inherit}

/* Tooltip for map hover */
.map-tooltip{position:absolute;pointer-events:none;background:rgba(7,11,20,.94);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:10px;color:var(--text);z-index:20;opacity:0;transition:opacity .15s;white-space:nowrap}
.map-tooltip.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1>🗺️ 5,600km 地貌之旅</h1>
  <div class="sub">2026暑假 · 广州→西北→广州 · 15天环形穿越</div>
  <div class="stats">
    <div class="stat"><div class="big">15</div><div class="label">天</div></div>
    <div class="stat"><div class="big warm">5,600</div><div class="label">公里</div></div>
    <div class="stat"><div class="big">14</div><div class="label">站</div></div>
    <div class="stat"><div class="big warm">12</div><div class="label">地貌</div></div>
    <div class="stat"><div class="big">3,800</div><div class="label">最高海拔(m)</div></div>
  </div>
</header>

<main>
  <div class="map-area" id="mapArea">
    <div class="map-tooltip" id="tooltip"></div>
    <svg id="routeMap" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" style="font-family:'SF Mono','Fira Code',monospace">
      <defs>
        <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="glowStrong"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#4a8c3f"/><stop offset="25%" stop-color="#c47030"/>
          <stop offset="45%" stop-color="#7a5c3a"/><stop offset="60%" stop-color="#5a8a5a"/>
          <stop offset="75%" stop-color="#d4a060"/><stop offset="90%" stop-color="#7a9a4a"/>
          <stop offset="100%" stop-color="#3a6a5a"/>
        </linearGradient>
      </defs>

      <!-- Terrain background bands -->
      <rect x="0" y="0" width="150" height="340" fill="#1e3318" opacity=".4"/>
      <rect x="150" y="0" width="120" height="340" fill="#2e1a0e" opacity=".4"/>
      <rect x="270" y="0" width="130" height="340" fill="#2a1a10" opacity=".4"/>
      <rect x="400" y="0" width="80" height="340" fill="#1e1810" opacity=".4"/>
      <rect x="480" y="0" width="100" height="340" fill="#3a2a18" opacity=".4"/>
      <rect x="580" y="0" width="150" height="340" fill="#1e2e1e" opacity=".4"/>
      <rect x="730" y="0" width="120" height="340" fill="#3e3018" opacity=".4"/>
      <rect x="850" y="0" width="100" height="340" fill="#2a3a1e" opacity=".4"/>
      <rect x="950" y="0" width="120" height="340" fill="#2e2010" opacity=".4"/>
      <rect x="1070" y="0" width="130" height="340" fill="#1e2e18" opacity=".4"/>

      <!-- Mountain silhouettes top -->
      <path d="M0,120 Q30,80 60,120 Q90,70 120,110 Q150,85 180,115 Q210,75 240,108 Q270,90 300,112 Q330,60 360,100 Q390,70 420,105 Q450,55 480,95 Q510,65 540,90 Q570,40 600,70 Q630,50 660,75 Q690,30 720,65 Q750,40 780,60 Q810,25 840,55 Q870,35 900,50 Q930,20 960,45 Q990,30 1020,50 Q1050,38 1080,52 Q1110,42 1140,55 Q1170,48 1200,55"
            fill="none" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
      <path d="M0,135 Q40,100 80,125 Q120,95 160,120 Q200,88 240,115 Q280,102 320,120 Q360,80 400,108 Q440,92 480,105 Q520,70 560,95 Q600,60 640,80 Q680,50 720,70 Q760,45 800,65 Q840,35 880,55 Q920,45 960,55 Q1000,38 1040,52 Q1080,45 1120,55 Q1160,50 1200,58"
            fill="none" stroke="rgba(255,255,255,.02)" stroke-width=".8"/>

      <!-- Desert dunes -->
      <path d="M850,250 Q870,220 890,250 Q910,225 930,250 Q950,230 970,250"
            fill="none" stroke="rgba(212,160,96,.08)" stroke-width="1.5"/>

      <!-- Route line -->
      <path id="routePath" d="
        M30,260 C40,240 60,200 90,210 C120,220 140,180 160,200
        C180,220 200,240 220,220 C240,200 260,150 280,170
        C300,190 310,210 330,200 C350,190 370,160 390,170
        C410,180 420,160 440,170 C460,180 470,140 490,130
        C510,120 530,90 560,100 C590,110 610,85 640,70
        C670,55 690,40 720,55 C750,70 770,90 790,110
        C810,130 820,120 840,140 C860,160 880,180 900,190
        C920,200 940,180 960,200 C980,220 1000,210 1020,220
        C1040,230 1060,240 1080,230 C1100,220 1120,200 1150,210
        C1170,215 1180,225 1190,240"
        fill="none" stroke="url(#routeGrad)" stroke-width="3" stroke-linecap="round" opacity=".8"/>
      <path d="M30,260 C40,240 60,200 90,210 C120,220 140,180 160,200 C180,220 200,240 220,220 C240,200 260,150 280,170 C300,190 310,210 330,200 C350,190 370,160 390,170 C410,180 420,160 440,170 C460,180 470,140 490,130 C510,120 530,90 560,100 C590,110 610,85 640,70 C670,55 690,40 720,55 C750,70 770,90 790,110 C810,130 820,120 840,140 C860,160 880,180 900,190 C920,200 940,180 960,200 C980,220 1000,210 1020,220 C1040,230 1060,240 1080,230 C1100,220 1120,200 1150,210 C1170,215 1180,225 1190,240" fill="none" stroke="rgba(77,208,225,.3)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

      <!-- Start/End markers -->
      <circle cx="30" cy="260" r="8" fill="var(--accent)" opacity=".9" filter="url(#glow)"/>
      <text x="30" y="282" text-anchor="middle" fill="var(--accent)" font-size="8" font-weight="700">广州</text>
      <circle cx="1190" cy="240" r="8" fill="#4ade80" opacity=".9" filter="url(#glow)"/>
      <text x="1190" y="262" text-anchor="middle" fill="#4ade80" font-size="8" font-weight="700">广州</text>

      <!-- Waypoints -->
      <!-- WP0: 广州 -->
      <circle cx="30" cy="260" r="5" class="wp-dot active" fill="var(--accent)" filter="url(#glowStrong)"
              data-id="0" data-name="广州" data-day="D1" data-elev="~20m" data-terrain="珠江三角洲 / 亚热带丘陵"
              data-color="#3a6a5a" data-desc="出发。从珠江口开始，穿过亚热带的绿色丘陵和稻田。"
              data-geo="珠江三角洲是中国最密集的城市群之一，由东/西/北三江冲积而成。"/>
      <!-- WP1: 兴平 -->
      <circle cx="120" cy="215" r="5" class="wp-dot" fill="#4a8c3f" filter="url(#glow)"
              data-id="1" data-name="兴平古镇" data-day="D1" data-elev="~150m" data-terrain="喀斯特峰林"
              data-color="#4a8c3f" data-desc="漓江边的千年古镇。石灰岩峰林从稻田里拔地而起，像桂林山水的浓缩版。"
              data-geo="喀斯特地貌——石灰岩被雨水溶蚀数百万年，形成独立的塔状峰林。"/>
      <!-- WP2: 遵义 -->
      <circle cx="230" cy="225" r="5" class="wp-dot" fill="#c47030"
              data-id="2" data-name="遵义会议会址" data-day="D2" data-elev="~900m" data-terrain="云贵高原红色盆地"
              data-color="#c47030" data-desc="从这里开始爬升。红色土壤铺满山丘，是中国革命的转折点。"
              data-geo="云贵高原是中国四大高原之一，红色土壤富含铁铝氧化物——湿热气候长期风化的结果。"/>
      <!-- WP3: 重庆 -->
      <circle cx="310" cy="195" r="5" class="wp-dot" fill="#c47030"
              data-id="3" data-name="重庆" data-day="D3" data-elev="~250m" data-terrain="四川盆地"
              data-color="#c47030" data-desc="山城、雾都、火锅。嘉陵江和长江在这里交汇，城市建在山坡上。"
              data-geo="四川盆地是中国四大盆地之一，四周高山环绕，内部低矮丘陵。"/>
      <!-- WP4: 安岳 -->
      <circle cx="370" cy="172" r="5" class="wp-dot" fill="#7a5c3a"
              data-id="4" data-name="安岳石刻" data-day="D4" data-elev="~350m" data-terrain="丘陵石刻群"
              data-color="#7a5c3a" data-desc="毗卢洞的紫竹观音——北宋。漫不经心地美了一千年。茗山寺的风蚀护法神——黑神话虎先锋的扫描原型。"
              data-geo="安岳石刻早于大足，盛唐至宋，是中国石窟艺术从北方向南方迁移的关键节点。"/>
      <!-- WP5: 广元 -->
      <circle cx="420" cy="165" r="5" class="wp-dot" fill="#7a5c3a"
              data-id="5" data-name="广元" data-day="D5" data-elev="~500m" data-terrain="盆地边缘 / 嘉陵江峡谷"
              data-color="#7a5c3a" data-desc="四川盆地的北大门。过了广元，就进入古代的"蜀道难"地带。"
              data-geo="广元是中国南北地理分界线上的城市——秦岭以南的最后一个盆地城市。"/>
      <!-- WP6: 剑门关 -->
      <circle cx="470" cy="140" r="5" class="wp-dot" fill="#7a5c3a"
              data-id="6" data-name="剑门关" data-day="D5" data-elev="~900m" data-terrain="蜀道天险"
              data-color="#7a5c3a" data-desc="一夫当关，万夫莫开。站在剑门关上，脚下是上千米的垂直断崖。"
              data-geo="剑门关是龙门山脉的断裂带——地壳挤压把山体劈开了一条缝，成了天然的关隘。"/>
      <!-- WP7: 兰州 -->
      <circle cx="550" cy="100" r="5" class="wp-dot" fill="#c4a060"
              data-id="7" data-name="兰州" data-day="D6" data-elev="~1,520m" data-terrain="黄土高原 / 黄河谷地"
              data-color="#c4a060" data-desc="黄河穿城而过。中山桥、白塔山、牛肉面的故乡。从这里开始，绿色越来越少。"
              data-geo="兰州坐落在黄河上游峡谷中，是青藏高原和黄土高原的过渡带。"/>
      <!-- WP8: 乌鞘岭 -->
      <circle cx="620" cy="78" r="5" class="wp-dot" fill="#5a8a5a"
              data-id="8" data-name="乌鞘岭" data-day="D7" data-elev="~3,000m" data-terrain="祁连山高山草甸"
              data-color="#5a8a5a" data-desc="进入祁连山的门槛。翻过乌鞘岭，气温骤降，窗外从荒漠变成草原。"
              data-geo="乌鞘岭是祁连山东段起点，也是中国季风区和非季风区的分界线——翻过它，就进入了干旱区。"/>
      <!-- WP9: 武威 -->
      <circle cx="680" cy="105" r="5" class="wp-dot" fill="#c4a060"
              data-id="9" data-name="武威" data-day="D7" data-elev="~1,500m" data-terrain="河西走廊绿洲"
              data-color="#c4a060" data-desc="鸠摩罗什寺——千古译经第一人的道场。雷台汉墓——马踏飞燕出土地。"
              data-geo="武威是河西走廊第一站，丝绸之路的咽喉。马踏飞燕是汉代青铜艺术的巅峰。"/>
      <!-- WP10: 仙米 -->
      <circle cx="740" cy="60" r="5" class="wp-dot" fill="#2a5a2a"
              data-id="10" data-name="仙米国家森林公园" data-day="D8" data-elev="~2,700m" data-terrain="原始云杉林"
              data-color="#2a5a2a" data-desc="墨绿色的云杉遮天蔽日，大通河清澈见底。下车踩了十分钟冰凉的溪水。"
              data-geo="仙米是中国海拔最高的原始云杉林之一。云杉能在海拔3,000m以上存活，靠的是极慢的生长速度——年轮密到数不清。"/>
      <!-- WP11: 门源 -->
      <circle cx="790" cy="48" r="5" class="wp-dot" fill="#d4a020"
              data-id="11" data-name="门源香卡村" data-day="D8" data-elev="~2,800m" data-terrain="高原油菜花海"
              data-color="#d4a020" data-desc="60万亩油菜花盛开。岗什卡雪山站在花海的尽头——金色地毯配白色雪山。"
              data-geo="门源油菜花是中国最大的高原油菜花海。海拔高、昼夜温差大，让花期比平原晚了两个月——7月才是它的春天。"/>
      <!-- WP12: 祁连山穿越 -->
      <circle cx="860" cy="55" r="5" class="wp-dot" fill="#c8d8e8"
              data-id="12" data-name="穿越祁连山" data-day="D9" data-elev="~3,600m" data-terrain="雪山垭口"
              data-color="#c8d8e8" data-desc="全程最高点。车窗外的雪线近在咫尺。从雪山下到沙漠，同一天两个极端。"
              data-geo="祁连山是青藏高原的北缘，山顶冰川是河西走廊的生命水源——没有祁连山的雪，就没有敦煌的绿洲。"/>
      <!-- WP13: 中卫沙坡头 -->
      <circle cx="940" cy="190" r="5" class="wp-dot" fill="#d4a060"
              data-id="13" data-name="中卫沙坡头" data-day="D9" data-elev="~1,200m" data-terrain="腾格里沙漠 + 黄河"
              data-color="#d4a060" data-desc="黄河在这里拐了一个大弯，沙漠直接冲向河岸。骑骆驼、滑沙、羊皮筏子。"
              data-geo="沙坡头是腾格里沙漠和黄河的交汇点——中国唯一一处沙漠紧贴大河的地方。黄河在这里把沙漠拦在了北岸。"/>
      <!-- WP14: 西安 -->
      <circle cx="1020" cy="215" r="5" class="wp-dot" fill="#7a9a4a"
              data-id="14" data-name="西安" data-day="D10-12" data-elev="~400m" data-terrain="关中平原"
              data-color="#7a9a4a" data-desc="碑林、昭陵六骏、城墙、大慈恩寺、大雁塔。玄奘在这里译经——真人才是最牛的。"
              data-geo="关中平原是渭河冲积而成，八百里秦川。十三朝古都选址在此，因为四面关隘环抱、易守难攻。"/>
      <!-- WP15: 衡阳 -->
      <circle cx="1100" cy="230" r="5" class="wp-dot" fill="#6b8e4a"
              data-id="15" data-name="衡阳" data-day="D14" data-elev="~60m" data-terrain="湘中南丘陵"
              data-color="#6b8e4a" data-desc="石鼓书院——中国四大书院之一。回程路上的最后一站，从黄土回到绿水。"
              data-geo="石鼓书院建于唐代，是湖湘文化的源头。衡阳位于南岳衡山脚下，是中国南北气候的分界城市之一。"/>

      <!-- Terrain labels at top -->
      <text x="75" y="18" class="terrain-label">🌿 珠江三角洲</text>
      <text x="200" y="18" class="terrain-label">🏔️ 喀斯特</text>
      <text x="330" y="18" class="terrain-label">⛰️ 云贵高原</text>
      <text x="460" y="18" class="terrain-label">🗡️ 蜀道</text>

<script>
(function(){
  var dots = document.querySelectorAll('.wp-dot');
  var panel = document.getElementById('infoPanel');
  var content = document.getElementById('infoContent');
  var handle = document.getElementById('infoHandle');
  var tooltip = document.getElementById('tooltip');
  var mapArea = document.getElementById('mapArea');
  var isMobile = window.innerWidth <= 860;

  // Default show first waypoint
  selectWaypoint(dots[0]);

  dots.forEach(function(d){
    d.addEventListener('click', function(e){
      e.stopPropagation();
      selectWaypoint(d);
      if(isMobile) panel.classList.add('open');
    });
    d.addEventListener('mouseenter', function(e){
      var name = d.dataset.name;
      var day = d.dataset.day;
      tooltip.textContent = day + ' · ' + name;
      tooltip.classList.add('show');
    });
    d.addEventListener('mousemove', function(e){
      var rect = mapArea.getBoundingClientRect();
      tooltip.style.left = (e.clientX - rect.left + 16) + 'px';
      tooltip.style.top = (e.clientY - rect.top - 36) + 'px';
    });
    d.addEventListener('mouseleave', function(){
      tooltip.classList.remove('show');
    });
  });

  // Handle mobile panel toggle
  if(handle){
    handle.addEventListener('click', function(){
      panel.classList.toggle('open');
    });
  }

  function selectWaypoint(d){
    dots.forEach(function(x){ x.classList.remove('active'); });
    d.classList.add('active');

    var name = d.dataset.name;
    var day = d.dataset.day;
    var elev = d.dataset.elev;
    var terrain = d.dataset.terrain;
    var color = d.dataset.color;
    var desc = d.dataset.desc;
    var geo = d.dataset.geo;

    content.innerHTML =
      '<h3>📍 ' + name + '</h3>' +
      '<div class="day">' + day + '</div>' +
      '<div class="elev">⬆ ' + elev + '</div>' +
      '<div class="terrain" style="background:rgba(' + hexToRgba(color, .15) + ');color:' + color + '">' + terrain + '</div>' +
      '<p class="desc">' + desc + '</p>' +
      '<div class="geo">🔬 ' + geo + '</div>';
  }

  function hexToRgba(hex, alpha){
    var r = parseInt(hex.slice(1,3), 16);
    var g = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    return r + ',' + g + ',' + b + ',' + alpha;
  }

  // Legend click - find waypoints with matching terrain
  document.querySelectorAll('.legend-item').forEach(function(item){
    item.addEventListener('click', function(){
      var label = item.textContent.replace(/D\d+(-\d+)?/,'').trim();
      // Find a matching waypoint
      var found = null;
      dots.forEach(function(d){
        if(!found && d.dataset.terrain && d.dataset.terrain.includes(label.slice(0,4))){
          found = d;
        }
      });
      if(found){
        selectWaypoint(found);
        if(isMobile) panel.classList.add('open');
        // Scroll to the waypoint on the map
        found.scrollIntoView({behavior:'smooth',block:'center'});
      }
    });
  });

  // Resize handler
  window.addEventListener('resize', function(){
    isMobile = window.innerWidth <= 860;
  });

  // Click on map area to close mobile panel
  mapArea.addEventListener('click', function(e){
    if(e.target === mapArea || e.target.tagName === 'svg'){
      if(isMobile) panel.classList.remove('open');
    }
  });
})();
</script>
