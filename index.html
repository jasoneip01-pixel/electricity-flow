<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5,viewport-fit=cover">
<title>2026暑假 · 5,600km 地貌之旅</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;--surface:#0d1220;--surface2:#141c2e;--border:rgba(148,200,255,.07);
  --text:#e2e8f0;--muted:#7888a8;--accent:#4dd0e1;--warm:#f0a050
}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}

header{padding:20px 16px 10px;text-align:center;border-bottom:1px solid var(--border)}
header h1{font-size:clamp(17px,4vw,26px);font-weight:800;letter-spacing:-.6px;margin-bottom:2px}
header .sub{font-size:11px;color:var(--muted);margin-bottom:8px}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;text-align:center;min-width:60px}
.stat .big{font-size:clamp(13px,2.2vw,20px);font-weight:800;line-height:1.2}
.stat .big.accent{color:var(--accent)}.stat .big.warm{color:var(--warm)}.stat .big.green{color:#4ade80}.stat .big.purple{color:#a78bfa}
.stat .label{font-size:8px;color:var(--muted)}

/* Main layout: map + panel */
main{display:grid;grid-template-columns:1fr 400px;min-height:420px;border-bottom:1px solid var(--border);position:relative}
@media(max-width:860px){main{grid-template-columns:1fr;min-height:360px}}

.map-area{position:relative;overflow:hidden;padding:10px 8px;display:flex;align-items:center;min-height:380px}
@media(max-width:860px){.map-area{min-height:290px;padding:8px 4px}}
.map-area svg{width:100%;height:auto;display:block}

.terrain-label{font-size:7px;fill:rgba(255,255,255,.4);text-anchor:middle;font-weight:500}

.wp-dot{cursor:pointer;transition:all .2s}
.wp-dot:hover{filter:brightness(1.8)}
.wp-dot.active{filter:brightness(2) drop-shadow(0 0 8px rgba(77,208,225,.7))}

/* Info panel */
.info-panel{padding:16px;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;max-height:640px;transition:all .3s}
@media(max-width:860px){
  .info-panel{position:fixed;bottom:0;left:0;right:0;z-index:50;max-height:58vh;border-left:none;border-top:1px solid var(--border);border-radius:18px 18px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.5);transform:translateY(calc(100% - 48px));background:rgba(13,18,32,.97);backdrop-filter:blur(12px)}
  .info-panel.open{transform:translateY(0)}
  .info-handle{display:flex;align-items:center;justify-content:center;padding:10px;cursor:pointer}
  .info-handle::before{content:'';width:36px;height:4px;background:var(--muted);border-radius:2px;opacity:.4}
}
@media(min-width:861px){.info-handle{display:none}}

.info-panel h3{font-size:14px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.info-panel .day{font-size:9px;color:var(--accent);font-weight:600;margin-bottom:4px}
.info-panel .meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.info-panel .elev{font-size:10px;color:var(--warm);font-weight:600}
.info-panel .terrain-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:8px;font-weight:600}
.info-panel .desc{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:6px}
.info-panel .kb{font-size:10px;line-height:1.5;padding:7px 9px;border-radius:8px;margin-bottom:5px}
.info-panel .kb-title{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;opacity:.6}
.info-panel .fact{font-size:10px;font-style:italic;color:rgba(255,255,255,.2);padding:6px 0;border-top:1px solid var(--border);margin-top:5px}

/* Sections below map */
section{padding:14px 16px;border-bottom:1px solid var(--border)}
section h2{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}

/* Elevation chart */
#elevChart svg{width:100%;height:auto;display:block}

/* Knowledge cards grid */
.knowledge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;transition:all .15s;cursor:pointer}
.kcard:hover{border-color:rgba(255,255,255,.15)}
.kcard-header{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.kcard-header .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.kcard-header .name{font-size:11px;font-weight:600}
.kcard-header .tag{font-size:8px;color:var(--muted)}
.kcard .oneliner{font-size:10px;color:var(--muted);line-height:1.4}
.kcard .info-row{display:flex;gap:10px;margin-top:4px;font-size:8px;color:rgba(255,255,255,.2)}

/* Legend */
.legend{padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.legend-item{display:flex;align-items:center;gap:3px;font-size:8px;color:var(--muted);padding:2px 7px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:5px;cursor:pointer;transition:all .12s}
.legend-item:hover{border-color:rgba(255,255,255,.2);color:var(--text)}
.legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

footer{padding:10px;text-align:center;font-size:7px;color:rgba(255,255,255,.06)}
footer a{color:inherit}

/* Tooltip */
.map-tooltip{position:absolute;pointer-events:none;background:rgba(7,11,20,.96);border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:9px;color:var(--text);z-index:20;opacity:0;transition:opacity .12s;white-space:nowrap}
.map-tooltip.show{opacity:1}

/* Tab bar */
.tab-bar{display:flex;gap:2px;margin-bottom:6px}
.tab-btn{font-size:9px;padding:4px 10px;border-radius:5px;cursor:pointer;border:1px solid transparent;background:none;color:var(--muted);transition:all .12s;font-family:inherit}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{background:rgba(77,208,225,.1);border-color:rgba(77,208,225,.2);color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}
</style>
</head>

var WAYPOINTS = [{"id": 0, "name": "广州", "day": "D1", "elev": "~20m", "terrain": "珠江三角洲 · 冲积平原", "color": "#3a6a5a", "desc": "出发。从珠江口开始，穿过亚热带的绿色丘陵和稻田。", "climate": "南亚热带季风气候 · 年均 22°C · 年降水 1,800mm · 夏季湿热、冬季温和。全年无霜，四季常绿。", "geo": "珠江三角洲是西江/北江/东江三条河流冲积而成的平原，面积约11,000km²。是中国最密集的城市群之一。土壤以水稻土和赤红壤为主，适宜热带水果种植。", "fact": "珠江三角洲每平方公里承载约1,500人——是全球人口密度最高的河口三角洲之一。", "cx": 30, "cy": 260}, {"id": 1, "name": "兴平古镇", "day": "D1", "elev": "~150m", "terrain": "喀斯特峰林", "color": "#4a8c3f", "desc": "漓江边的千年古镇。石灰岩峰林从稻田里拔地而起，像桂林山水的浓缩版。", "climate": "中亚热带湿润季风气候 · 年均 19°C · 年降水 1,900mm · 雨季4-8月占全年降水70%。", "geo": "喀斯特（Karst）地貌：石灰岩（CaCO₃）被含碳酸的雨水溶蚀数百万年，形成独立的塔状峰林。桂林-阳朔一带是中国最典型的峰林地貌，世界自然遗产。化学方程式：CaCO₃ + H₂CO₃ → Ca(HCO₃)₂（可溶）。", "fact": "桂林山水在徐霞客笔下被称为「碧莲玉笋世界」——他在1637年走了整个桂林地区，是第一个系统记录喀斯特地貌的人。", "cx": 120, "cy": 215}, {"id": 2, "name": "遵义会议会址", "day": "D2", "elev": "~900m", "terrain": "云贵高原 · 红色盆地", "color": "#c47030", "desc": "从这里开始爬升。红色土壤铺满山丘，是中国革命的转折点。", "climate": "亚热带高原季风气候 · 年均 15°C · 年降水 1,100mm · 冬无严寒、夏无酷暑。海拔每升高100m气温降0.6°C。", "geo": "云贵高原是中国四大高原之一，海拔1,000-2,000m。红色土壤富含铁铝氧化物（Fe₂O₃、Al₂O₃）——湿热气候长期风化的结果。这种「红壤」酸性强、肥力低，但适合种茶和马铃薯。", "fact": "遵义的红层地貌形成于侏罗纪-白垩纪（约1.5亿年前），那时这里还是湖泊，红色来自沉积物中的氧化铁。", "cx": 230, "cy": 225}, {"id": 3, "name": "重庆", "day": "D3", "elev": "~250m", "terrain": "四川盆地 · 山城", "color": "#c47030", "desc": "山城、雾都、火锅。嘉陵江和长江在这里交汇，城市建在山坡上。", "climate": "中亚热带湿润季风气候 · 年均 18°C · 年降水 1,100mm · 冬季多雾（年均104天雾日）· 夏季酷热（曾达44.5°C），是中国「火炉」之一。", "geo": "四川盆地是中国四大盆地之一，面积约26万km²。四周高山环绕（北秦岭、西横断山脉、南云贵高原、东巫山），内部是低矮的紫红色丘陵。盆地形成于印度板块挤压欧亚板块的造山运动中。", "fact": "重庆是「建在侏罗纪岩层上的城市」——朝天门码头的基岩是1.6亿年前的砂岩，上面还留着恐龙时代的波纹痕迹。", "cx": 310, "cy": 195}, {"id": 4, "name": "安岳石刻", "day": "D4", "elev": "~350m", "terrain": "丘陵 · 唐宋摩崖石刻群", "color": "#7a5c3a", "desc": "毗卢洞的紫竹观音——北宋。漫不经心地美了一千年。茗山寺的风蚀护法神——黑神话虎先锋的扫描原型。", "climate": "中亚热带湿润季风气候 · 年均 17°C · 年降水 1,000mm。砂岩易风化，千年风雨在护法神像上刻出了刀刃般的纹理。", "geo": "安岳石刻开凿于盛唐至南宋，以红砂岩为载体。砂岩较石灰岩软，易于雕刻但易风化。茗山寺的护法神暴露在露天，千年风雨把岩石中的软层侵蚀掉，硬的石英颗粒留了下来——形成了黑神话中惊艳的「原生风蚀纹理」。", "fact": "安岳全县有200+处石刻，但大部分散布在田间地头。紫竹观音所在的毗卢洞，管理员常因下田种地而锁门——去之前必须打电话确认。", "cx": 370, "cy": 172}, {"id": 5, "name": "广元", "day": "D5", "elev": "~500m", "terrain": "盆地北缘 · 嘉陵江峡谷", "color": "#7a5c3a", "desc": "四川盆地的北大门。过了广元，进入古代的「蜀道难」地带。", "climate": "北亚热带湿润季风气候 · 年均 16°C · 年降水 1,000mm。处于中国南北气候分界线的南侧。", "geo": "广元位于龙门山断裂带前缘——2008年汶川地震就在这里释放了巨大的构造应力。嘉陵江在这里切穿了秦岭余脉，形成了天然的南北通道。", "fact": "广元是中国唯一的女皇帝武则天（624-705年）的出生地。她在位时期，佛教石窟艺术达到了唐代的最高峰——安岳石刻的开端与她推动佛教有关。", "cx": 420, "cy": 165}, {"id": 6, "name": "剑门关", "day": "D5", "elev": "~900m", "terrain": "蜀道天险 · 断层峡谷", "color": "#7a5c3a", "desc": "一夫当关，万夫莫开。站在剑门关上，脚下是上千米的垂直断崖。", "climate": "山地气候 · 山顶年均 14°C · 峡谷风力强劲。冬天有积雪，夏季凉爽。南北两侧气候差异巨大。", "geo": "剑门关是龙门山脉的断裂带——印度板块推挤欧亚板块时，地壳被「挤断」，形成了一条天然的垂直裂缝。裂缝宽仅30-50米，两侧是数百米高的绝壁。三国时期，诸葛亮在此筑关。李白写「剑阁峥嵘而崔嵬，一夫当关，万夫莫开」。", "fact": "剑门关的岩石是白垩纪（约1亿年前）的砾岩——由远古河流冲刷下来的卵石胶结而成。站在关下可以看到岩壁里嵌满了拳头大的鹅卵石。", "cx": 470, "cy": 140}, {"id": 7, "name": "兰州", "day": "D6", "elev": "~1,520m", "terrain": "黄土高原 · 黄河谷地", "color": "#c4a060", "desc": "黄河穿城而过。中山桥、白塔山、牛肉面的故乡。从这里开始，绿色越来越少。", "climate": "温带半干旱大陆性气候 · 年均 10°C · 年降水 320mm（仅广州的1/6！）。昼夜温差可达15°C。", "geo": "兰州坐落在黄河上游峡谷中，是青藏高原和黄土高原的过渡带。黄土高原的黄土是200万年来从中亚沙漠吹来的风积物，厚度可达100-300米——地球上最厚的黄土堆积。黄河在这里携带大量泥沙，每立方米河水含沙量约3kg。", "fact": "正宗的兰州牛肉面讲究「一清二白三红四绿五黄」——汤清、萝卜白、辣椒红、蒜苗绿、面条黄。出了兰州，水的硬度变了，面就拉不出同样的筋道。", "cx": 550, "cy": 100}, {"id": 8, "name": "乌鞘岭", "day": "D7", "elev": "~3,000m", "terrain": "祁连山高山草甸", "color": "#5a8a5a", "desc": "进入祁连山的门槛。翻过乌鞘岭，气温骤降，窗外从荒漠变成草原。", "climate": "高原大陆性气候 · 年均 0°C · 年降水 400mm · 7月最高仅20°C。这里是季风区和非季风区的分界线。", "geo": "乌鞘岭是祁连山东段起点，也是中国三大自然区（东部季风区、西北干旱区、青藏高寒区）的交汇点。翻过它，意味着告别了太平洋季风的势力范围——从湿润区进入干旱区。", "fact": "乌鞘岭是亚洲内陆流域和太平洋流域的分水岭。岭东的雨水最终流向太平洋，岭西的雨水蒸发或渗入戈壁——一滴都到不了海。", "cx": 620, "cy": 78}, {"id": 9, "name": "武威", "day": "D7", "elev": "~1,500m", "terrain": "河西走廊绿洲", "color": "#c4a060", "desc": "鸠摩罗什寺——千古译经第一人的道场。雷台汉墓——马踏飞燕出土地。", "climate": "温带干旱大陆性气候 · 年均 8°C · 年降水 160mm · 全年日照超3,000小时。水来自祁连山冰川融水，不是雨水。", "geo": "武威是河西走廊第一站。河西走廊是一条长1,000km、宽仅10-100km的狭窄通道，夹在祁连山和巴丹吉林沙漠之间。所有城市（武威/张掖/酒泉/敦煌）都建在祁连山融水形成的绿洲上——没有祁连山的雪，就没有河西走廊。", "fact": "马踏飞燕（铜奔马）1969年出土于武威雷台汉墓。高34.5cm，重7.15kg，一足踏燕三足腾空——汉代工匠把力学平衡做到了极致：整匹马的重心恰好落在踏燕的足尖上。", "cx": 680, "cy": 105}, {"id": 10, "name": "仙米国家森林公园", "day": "D8", "elev": "~2,700m", "terrain": "原始云杉林", "color": "#2a5a2a", "desc": "墨绿色的云杉遮天蔽日，大通河清澈见底。下车踩了十分钟冰凉的溪水。", "climate": "高山寒温带湿润气候 · 年均 -1°C · 年降水 500mm · 7月均温仅12°C。夏季是全年唯一不降雪的季节。", "geo": "仙米是中国海拔最高的原始云杉林之一。祁连圆柏和青海云杉是优势树种，能在海拔3,000m以上存活靠的是极慢的生长速度——年轮密到用放大镜才能看清。一棵碗口粗的云杉可能已生长了300年。", "fact": "仙米的云杉林是祁连山的「天然水库」——树冠截留降雪，落叶层像海绵一样蓄水，慢释放到大通河中。保护这片森林就是保护河西走廊的水源。", "cx": 740, "cy": 60}, {"id": 11, "name": "门源香卡村", "day": "D8", "elev": "~2,800m", "terrain": "高原油菜花海", "color": "#d4a020", "desc": "60万亩油菜花盛开。岗什卡雪山站在花海的尽头——金色地毯配白色雪山。", "climate": "高原大陆性气候 · 年均 1°C · 年降水 520mm · 7月均温12-15°C。高海拔让油菜花期比平原晚了三个月——7月才是它的春天。", "geo": "门源油菜花是中国最大的高原油菜花海。高海拔（2,800m）+ 长日照（每天14h）+ 大温差（昼夜15°C）→ 油菜籽含油率比平原高2-3个百分点。岗什卡雪山（5,254m）是祁连山东段最高峰，山顶终年积雪。", "fact": "门源油菜花的最佳观赏窗口只有2-3周（7月中旬到8月初）。错过了就得等一年——高原上的春天不是钟表，是瞬移。", "cx": 790, "cy": 48}, {"id": 12, "name": "穿越祁连山", "day": "D9", "elev": "~3,600m", "terrain": "雪山垭口 · 冰缘地貌", "color": "#c8d8e8", "desc": "全程最高点。车窗外的雪线近在咫尺。从雪山下到沙漠，同一天两个极端。", "climate": "高山冰缘气候 · 年均 -5°C · 年降水 600-800mm（以降雪为主）· 7月垭口气温5-10°C。全年积雪期8个月以上。", "geo": "祁连山是青藏高原的北缘，东西长800km。山顶发育了现代冰川（总共2,683条），每年融化出约10亿m³的水——相当于70个西湖。这是河西走廊和柴达木盆地的唯一水源。地质构造上，祁连山是印度板块挤压形成的褶皱带，岩石年龄从10亿年（前寒武纪）到1亿年（白垩纪）都有。", "fact": "从祁连山垭口下到中卫沙坡头，同一天内海拔下降2,400m——相当于从雪山山顶直接降到海平面以下。这一天经历了地球上垂直落差最大的公路穿越之一。", "cx": 860, "cy": 55}, {"id": 13, "name": "中卫沙坡头", "day": "D9", "elev": "~1,200m", "terrain": "腾格里沙漠 · 黄河交汇", "color": "#d4a060", "desc": "黄河在这里拐了一个大弯，沙漠直接冲向河岸。骑骆驼、滑沙、羊皮筏子。", "climate": "温带干旱沙漠气候 · 年均 9°C · 年降水仅 186mm · 年蒸发量高达2,000mm（降水vs蒸发=1:11！）。夏季最高温可达40°C。", "geo": "沙坡头是腾格里沙漠和黄河的交汇点——中国唯一一处沙漠紧贴大河的地方。腾格里沙漠面积4.27万km²，是中国第四大沙漠。黄河在这里被沙丘逼着拐了一个近乎90°的大弯。1958年包兰铁路通车时，工程人员发明了「麦草方格」固沙法——用麦草扎成1m×1m的方格埋进沙里，至今仍是全球治沙的经典方案。", "fact": "羊皮筏子是黄河上游独有的交通工具——将整张羊皮剥下充气，十几只绑在一起。一张皮筏能载一吨货，用了两千年。", "cx": 940, "cy": 190}, {"id": 14, "name": "西安", "day": "D10-12", "elev": "~400m", "terrain": "关中平原 · 渭河冲积", "color": "#7a9a4a", "desc": "碑林、昭陵六骏、城墙、大慈恩寺、大雁塔。玄奘在这里译经——真人才是最牛的。", "climate": "暖温带半湿润大陆性季风气候 · 年均 14°C · 年降水 570mm · 四季分明。冬季干燥寒冷，夏季炎热多雨。", "geo": "关中平原是渭河冲积而成的断陷盆地，东西长300km，面积约3.4万km²。八百里秦川。十三朝古都选址在此因为四面关隘环抱（东函谷、南武关、西散关、北萧关）——易守难攻。地下水位高，土壤肥沃（黄土层深达100m+），是「天府之国」的原意。", "fact": "大雁塔是玄奘（602-664年）为存放从印度带回的657部佛经而建。他在大慈恩寺住了19年，译出1,335卷佛经——如果按字数算，相当于每天翻译约3,000字的专业文献，连续19年无休。", "cx": 1020, "cy": 215}, {"id": 15, "name": "衡阳", "day": "D14", "elev": "~60m", "terrain": "湘中南丘陵 · 南岳山麓", "color": "#6b8e4a", "desc": "石鼓书院——中国四大书院之一。回程路上的最后一站，从黄土回到绿水。", "climate": "中亚热带湿润季风气候 · 年均 18°C · 年降水 1,350mm。处于中国南北气候分界线（南岭-衡山一线）的南侧，自此以南便是绵绵不绝的亚热带绿意。", "geo": "衡阳位于南岳衡山（1,300m）脚下。衡山是中国五岳之一，花岗岩岩体。石鼓书院建于唐代（810年），朱熹、王阳明曾在此讲学——是「湖湘文化」的发源地。从衡阳开始，窗外从黄土回到绿水，从北方回到南方。", "fact": "石鼓书院名字来自于一块天然巨石——它立在蒸水和湘江交汇处，形如石鼓。涨水时江水拍石，「声如鼓鸣」。", "cx": 1100, "cy": 230}];

// === DOM ===
var dots = document.querySelectorAll('.wp-dot');
var panel = document.getElementById('infoPanel');
var content = document.getElementById('infoContent');
var handle = document.getElementById('infoHandle');
var tooltip = document.getElementById('tooltip');
var mapArea = document.getElementById('mapArea');
var isMobile = window.innerWidth <= 860;

// Select waypoint
function selectWP(data){
  dots.forEach(function(x){ x.classList.remove('active'); });
  document.querySelector('[data-id="'+data.id+'"]').classList.add('active');

  content.innerHTML =
    '<h3>📍 ' + data.name + '</h3>' +
    '<div class="day">' + data.day + '</div>' +
    '<div class="meta-row">' +
    '<span class="elev">⬆ ' + data.elev + '</span>' +
    '<span class="terrain-tag" style="background:rgba(' + hexRgba(data.color,.15) + ');color:' + data.color + '">' + data.terrain + '</span>' +
    '</div>' +
    '<p class="desc">' + data.desc + '</p>' +
    '<div class="kb" style="background:rgba(77,208,225,.05)">' +
    '<div class="kb-title">🌦️ 气候条件</div>' +
    data.climate +
    '</div>' +
    '<div class="kb" style="background:rgba(167,139,250,.05)">' +
    '<div class="kb-title">🏔️ 地理地貌</div>' +
    data.geo +
    '</div>' +
    '<div class="fact">💡 ' + data.fact + '</div>';
}

// === Initialize dots ===
dots.forEach(function(d){
  d.addEventListener('click', function(e){
    e.stopPropagation();
    var wp = WAYPOINTS.find(function(w){ return w.id == d.dataset.id; });
    if(wp) selectWP(wp);
    if(isMobile) panel.classList.add('open');
  });
  d.addEventListener('mouseenter', function(e){
    var wp = WAYPOINTS.find(function(w){ return w.id == d.dataset.id; });
    tooltip.textContent = (wp ? wp.day + ' · ' + wp.name : '');
    tooltip.classList.add('show');
  });
  d.addEventListener('mousemove', function(e){
    var r = mapArea.getBoundingClientRect();
    tooltip.style.left = (e.clientX - r.left + 14) + 'px';
    tooltip.style.top = (e.clientY - r.top - 32) + 'px';
  });
  d.addEventListener('mouseleave', function(){ tooltip.classList.remove('show'); });
});

// Select first by default
selectWP(WAYPOINTS[0]);

// Mobile panel toggle
if(handle){
  handle.addEventListener('click', function(){ panel.classList.toggle('open'); });
}
mapArea.addEventListener('click', function(e){
  if(e.target === mapArea || e.target.tagName === 'svg'){
    if(isMobile) panel.classList.remove('open');
  }
});

// === Knowledge Cards ===
function buildCard(wp){
  return '<div class="kcard" onclick="document.querySelector(\'[data-id=&quot;' + wp.id + '&quot;]\').click(); window.scrollTo({top:0,behavior:\'smooth\'})">' +
    '<div class="kcard-header">' +
    '<span class="dot" style="background:' + wp.color + '"></span>' +
    '<span class="name">' + wp.name + '</span>' +
    '<span class="tag">' + wp.day + '</span>' +
    '</div>' +
    '<div class="oneliner">' + wp.desc + '</div>' +
    '<div class="info-row"><span>⬆ ' + wp.elev + '</span><span>' + wp.terrain + '</span></div>' +
    '</div>';
}
function buildGeoCard(wp){
  return '<div class="kcard" onclick="document.querySelector(\'[data-id=&quot;' + wp.id + '&quot;]\').click(); window.scrollTo({top:0,behavior:\'smooth\'})">' +
    '<div class="kcard-header"><span class="dot" style="background:' + wp.color + '"></span><span class="name">' + wp.name + '</span></div>' +
    '<div class="oneliner">' + wp.geo + '</div></div>';
}
function buildClimateCard(wp){
  return '<div class="kcard" onclick="document.querySelector(\'[data-id=&quot;' + wp.id + '&quot;]\').click(); window.scrollTo({top:0,behavior:\'smooth\'})">' +
    '<div class="kcard-header"><span class="dot" style="background:' + wp.color + '"></span><span class="name">' + wp.name + '</span></div>' +
    '<div class="oneliner">' + wp.climate + '</div></div>';
}
function buildFunCard(wp){
  return '<div class="kcard" onclick="document.querySelector(\'[data-id=&quot;' + wp.id + '&quot;]\').click(); window.scrollTo({top:0,behavior:\'smooth\'})">' +
    '<div class="kcard-header"><span class="dot" style="background:' + wp.color + '"></span><span class="name">' + wp.name + '</span></div>' +
    '<div class="oneliner">💡 ' + wp.fact + '</div></div>';
}

document.getElementById('cardGrid').innerHTML = WAYPOINTS.map(buildCard).join('');
document.getElementById('cardGridGeo').innerHTML = WAYPOINTS.map(buildGeoCard).join('');
document.getElementById('cardGridClimate').innerHTML = WAYPOINTS.map(buildClimateCard).join('');
document.getElementById('cardGridFun').innerHTML = WAYPOINTS.map(buildFunCard).join('');

// Tab switching
document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(function(t){ t.classList.remove('active'); });
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// Legend click
document.querySelectorAll('.legend-item').forEach(function(item, i){
  item.addEventListener('click', function(){
    if(WAYPOINTS[i]) selectWP(WAYPOINTS[i]);
    if(isMobile) panel.classList.add('open');
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

// Resize
window.addEventListener('resize', function(){ isMobile = window.innerWidth <= 860; });

function hexRgba(hex, a){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return r+','+g+','+b+','+a;
}
</script>
